[package]
name = "rover-kernel"
version = "0.1.0"
edition = "2024"
authors = ["Muhammad Fiaz <contact@muhammadfiaz.com>"]
description = "A modern, modular, high-performance operating system kernel in native Rust"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/muhammad-fiaz/rover-kernel"
homepage = "https://github.com/muhammad-fiaz/rover-kernel#readme"

[lib]
name = "rover_kernel"
path = "src/lib.rs"

[features]
default = ["kernel-bin"]
kernel-bin = []

[[bin]]
name = "rover-kernel"
path = "src/main.rs"
required-features = ["kernel-bin"]
test = false
bench = false

[dependencies]
rover-uefi = { git = "https://github.com/muhammad-fiaz/rover-uefi.git" }
rover-bootloader = { git = "https://github.com/muhammad-fiaz/rover-bootloader.git" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
manual_is_multiple_of = "allow"
