[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "link-arg=-Tlinker/x86_64.ld",
    "-C", "link-arg=-zmax-page-size=0x1000",
    "-C", "link-arg=--no-relax",
    "-C", "link-arg=-no-pie",
    "-C", "link-arg=--static",
]
